services:
  - type: web
    name: mak-os
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_TEMPLATE_SID
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: OUTREACH_FROM_EMAIL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
